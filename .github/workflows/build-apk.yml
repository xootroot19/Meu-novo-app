      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Instalar dependências
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi
      - name: Conferir compatibilidade e código
        run: |
          npx expo install --check
          npm run check
          npm test
          npm run export:android
      - name: Gerar projeto Android
        run: npm run prebuild
      - name: Configurar assinatura de distribuição
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "Usando o keystore configurado nos segredos do repositório."
            echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > android/app/bunnymodels-release.jks
            KS_PASS="$ANDROID_KEYSTORE_PASSWORD"
            KS_ALIAS="$ANDROID_KEY_ALIAS"
            KEY_PASS="$ANDROID_KEY_PASSWORD"
          else
            echo "Nenhum segredo de assinatura configurado: gerando uma chave automática só para esta compilação."
            KS_PASS="bunnymodels-auto"
            KS_ALIAS="bunnymodels"
            KEY_PASS="bunnymodels-auto"
            keytool -genkeypair -v -noprompt \
              -keystore android/app/bunnymodels-release.jks \
              -alias "$KS_ALIAS" -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass "$KS_PASS" -keypass "$KEY_PASS" \
              -dname "CN=BunnyModels, OU=App, O=BunnyModels, L=Sao Paulo, S=SP, C=BR"
          fi
          {
            echo "ANDROID_KEYSTORE_PASSWORD=$KS_PASS"
            echo "ANDROID_KEY_ALIAS=$KS_ALIAS"
            echo "ANDROID_KEY_PASSWORD=$KEY_PASS"
          } >> "$GITHUB_ENV"
          export ANDROID_KEYSTORE_PASSWORD="$KS_PASS" ANDROID_KEY_ALIAS="$KS_ALIAS" ANDROID_KEY_PASSWORD="$KEY_PASS"
          python3 scripts/configure-signing.py
      - name: Compilar APK e AAB assinados
        working-directory: android
        run: ./gradlew app:assembleRelease app:bundleRelease --no-daemon --max-workers=2 -PreactNativeArchitectures=arm64-v8a,armeabi-v7a
      - name: Remover keystore do executor
        if: always()
        run: rm -f android/app/bunnymodels-release.jks
      - name: Disponibilizar pacotes
        uses: actions/upload-artifact@v4
        with:
          name: BunnyModels-Android
          path: |
            android/app/build/outputs/apk/release/*.apk
            android/app/build/outputs/bundle/release/*.aab
            package-lock.json
          if-no-files-found: error
          retention-days: 14
